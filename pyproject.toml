[project]
name = "intervals-icu-mcp"
version = "0.1.0"
description = "MCP server for intervals.icu"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2,<2", "httpx>=0.27"]

[project.scripts]
intervals-mcp = "intervals_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_mcp"]
